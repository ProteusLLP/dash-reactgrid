name: Build and test virtual selection review fix
on:
  push:
    branches:
      - feat/virtual-whole-column-fill
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci --legacy-peer-deps
      - name: Rebuild Dash assets
        run: npm run build:js
      - name: Install browser test dependencies
        run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3"
      - name: Test Shift+Arrow keyboard selection
        run: python3 -m unittest tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_server_virtual_shift_arrow_after_click_keeps_full_selection -v
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild browser assets for keyboard range review fix"
            git push origin HEAD:feat/virtual-whole-column-fill
          fi
