name: Feature branch bundle build
on:
  push:
    branches:
      - feat/multilevel-headers-dataframe
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Test JavaScript source
        run: npm run test:js
      - name: Test Python API
        run: |
          python3 -m pip install "dash>=3,<5" "numpy>=1.23,<3" "pandas>=2,<3"
          python3 -m unittest tests.test_dataframe tests.test_column -v
      - name: Build distributable JavaScript
        run: npm run build:js
      - name: Commit generated browser bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Dash browser assets for grouped headers"
            git push origin HEAD:feat/multilevel-headers-dataframe
          fi
