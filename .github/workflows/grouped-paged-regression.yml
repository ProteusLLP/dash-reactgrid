name: Grouped paged regression
on:
  push:
    branches:
      - feat/multilevel-headers-dataframe
jobs:
  grouped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test Python dependencies
        run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3" "pandas>=2,<3"
      - name: Run targeted grouped paged Chrome regression
        run: python3 -m unittest tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_grouped_paged_headers_preserve_absolute_paste_and_fill_down -v
