name: JavaScript unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript unit tests
        run: npm run test:js
