name: JavaScript tests and build

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'perf/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and test dependencies
        run: npm ci --legacy-peer-deps
      - name: Run JavaScript unit tests
        shell: bash
        run: node --experimental-detect-module --test --experimental-test-coverage --test-coverage-include='src/lib/**' --test-coverage-exclude='**/*.test.js' --test-coverage-exclude='**/*.test.mjs' | tee js-coverage.txt
      - name: Compile component
        run: npm run build:js
      - name: Verify committed browser assets match source
        run: git diff --exit-code -- dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map


      - name: Benchmark large tables
        run: node --experimental-detect-module scripts/benchmark-large-grid.mjs
      - name: Benchmark numeric binary data transport
        run: node --experimental-detect-module scripts/benchmark-numpy-data.mjs
      - name: Test stateless provider callbacks
        run: python3 -m unittest discover -s tests -p test_stateless_virtual_callbacks.py -v
      - name: Test optional SQLite fixture protocol
        run: python3 -m unittest discover -s tests -p test_sparse_edit_server.py -v
      - name: Test virtual operations against optional SQLite fixture
        run: python3 -m unittest discover -s tests -p test_virtual_grid_store.py -v
      - name: Install Dash and Selenium browser testing
        run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3"
      - name: Test Python column helper
        run: python3 -m unittest tests.test_column -v
      - name: Test NumPy binary grid transport and callbacks
        run: python3 -m unittest tests.test_numpy_data -v
      - name: Test Python column and stateless callback contracts
        run: python3 -m unittest tests.test_component_contract -v
      - name: Collect Python branch coverage (unit contracts)
        run: |
          python3 -m pip install "coverage>=7,<8"
          python3 -m coverage run --branch --source=dash_reactgrid -m unittest tests.test_column tests.test_numpy_data tests.test_component_contract tests.test_stateless_virtual_callbacks tests.test_sparse_edit_server tests.test_virtual_grid_store
          python3 -m coverage report -m | tee python-coverage.txt
          python3 -m coverage xml -o python-coverage.xml
      - name: Publish unit coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            js-coverage.txt
            python-coverage.txt
            python-coverage.xml
          if-no-files-found: warn
      - name: Test full Chrome cell, clipboard and interaction matrix
        run: python3 tests/test_feature_matrix_browser.py
      - name: Test real-browser sparse edit and ACK
        run: python3 tests/test_sparse_browser.py
      - name: Test server virtualization in Chrome
        run: python3 tests/test_server_virtual_browser.py
      - name: Test virtual structural edits, offscreen clipboard and undo
        run: python3 tests/test_virtual_operations_browser.py
      - name: Test server virtualization with durable sparse edits
        run: python3 tests/test_virtual_reliable_browser.py
      - name: Benchmark browser-memory viewport preparation
        run: node --experimental-detect-module scripts/benchmark-client-virtual.mjs
      - name: Test client-side virtualisation in Chrome
        run: python3 tests/test_client_virtual_browser.py
      - name: Test in-memory operations across more than 20,000 cells
        run: python3 tests/test_large_in_memory_browser.py
      - name: Test Ctrl+A Ctrl+C clipboard streaming over 25,000 virtual rows
        run: python3 tests/test_large_virtual_clipboard_browser.py
