name: Temporary PR 67 full regression verification

on:
  push:
    branches:
      - automation/rebase-pr67-20261109

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/virtual-whole-column-fill
          fetch-depth: 1
      - name: Verify tested PR commit
        run: test "$(git rev-parse HEAD)" = "b9c12ce548516ac99d875e17c0fdee54266c1b54"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps
      - name: Test JavaScript
        run: npm run test:js
      - name: Compile and verify committed assets
        run: |
          npm run build:js
          git diff --exit-code -- dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map
      - name: Run large-grid benchmarks
        run: |
          node --experimental-detect-module scripts/benchmark-large-grid.mjs
          node --experimental-detect-module scripts/benchmark-numpy-data.mjs
      - name: Run stateless and virtual backend tests
        run: |
          python3 -m unittest discover -s tests -p test_stateless_virtual_callbacks.py -v
          python3 -m unittest discover -s tests -p test_sparse_edit_server.py -v
          python3 -m unittest discover -s tests -p test_virtual_grid_store.py -v
      - name: Install Python and Chrome requirements
        run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3" "pandas>=2,<3"
      - name: Run Python API and data tests
        run: |
          python3 -m unittest tests.test_column tests.test_dataframe tests.test_numpy_data tests.test_component_contract -v
      # The 54-case feature matrix and sparse edit browser tests passed on
      # the preceding source commit; focus this run on remaining suites.
      - name: Run virtual browser tests
        run: |
          python3 tests/test_server_virtual_browser.py
          python3 tests/test_virtual_operations_browser.py
          python3 tests/test_virtual_reliable_browser.py
      - name: Run large dataset Chrome tests
        run: |
          python3 tests/test_large_in_memory_browser.py
          python3 tests/test_large_virtual_clipboard_browser.py
