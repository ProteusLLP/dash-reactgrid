name: Temporary PR 67 Chrome fix verification

on:
  push:
    branches:
      - automation/rebase-pr67-20261109

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR 67 branch
        uses: actions/checkout@v4
        with:
          ref: feat/virtual-whole-column-fill
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source head and configure Git
        run: |
          set -euo pipefail
          git fetch origin feat/virtual-whole-column-fill
          test "$(git rev-parse HEAD)" = "6dad580a25a8e8328e2a9c2d467db3384b88a3b1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install and build
        run: |
          npm ci --legacy-peer-deps
          npm run build:js
          npm run test:js
      - name: Install Chrome test dependencies
        run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3" "pandas>=2,<3"
      - name: Test Ctrl+F on server-virtual grids
        run: |
          python3 -m unittest -v \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_cell_copies_without_preparing_a_range \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_clears_public_native_selection \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_dataset_replacement_clears_old_edit_destination \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_date_and_time_copies_provider_values \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_enter_does_not_issue_duplicate_pending_requests \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_selection_rebases_and_copies_loaded_cell \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_virtual_find_structural_ack_clears_old_edit_destination
      - name: Commit and push regenerated asset files
        run: |
          set -euo pipefail
          git diff --check
          git add -- dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map \
            deps/dash_reactgrid.min.js deps/dash_reactgrid.min.js.map \
            inst/deps/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js.map
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Dash bundles after virtual Find restoration"
            git push origin HEAD:refs/heads/feat/virtual-whole-column-fill
          fi
