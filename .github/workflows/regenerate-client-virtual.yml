name: Regenerate client-virtualisation assets (temporary)

on:
  push:
    branches:
      - feature/client-memory-virtualization

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install "dash>=3,<5" "numpy>=1.23,<3" "pyyaml>=6"
      - name: Generate JavaScript and Python/R/Julia bindings
        run: npm run build
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map \
            dash_reactgrid/metadata.json dash_reactgrid/DashReactGrid.py \
            R/dashReactGrid.R man/dashReactGrid.Rd src/jl/dashreactgrid.jl
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate client virtualisation bundles and bindings"
            git push origin HEAD:feature/client-memory-virtualization
          fi
