name: Regenerate server virtualization assets
on:
  push:
    branches:
      - fix/server-virtual-stability-20261120
permissions:
  contents: write
concurrency:
  group: regenerate-server-virtual-stability-assets
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'ProteusLLP/dash-reactgrid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-virtual-stability-20261120
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Refresh latest feature source before building
        run: |
          git fetch origin fix/server-virtual-stability-20261120
          git reset --hard origin/fix/server-virtual-stability-20261120
      - name: Regenerate browser bundle
        run: npm run build:js
      - name: Commit reproducible browser assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate server virtualization browser assets'
            git push origin HEAD:fix/server-virtual-stability-20261120
          fi
