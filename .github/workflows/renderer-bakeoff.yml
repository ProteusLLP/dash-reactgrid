name: Experimental renderer bakeoff

on:
  pull_request:
    paths:
      - 'experiments/renderer-bakeoff/**'
      - '.github/workflows/renderer-bakeoff.yml'
  workflow_dispatch:

jobs:
  renderer-bakeoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/renderer-bakeoff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome for Playwright
        id: chrome
        run: npx playwright install --with-deps chromium
      - name: Fixture unit tests
        run: npm run test:unit
      - name: Build three renderer adapters
        run: npm run build
      - name: Chrome renderer and keyboard probes
        run: npm run test:browser
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-browser-observations
          path: experiments/renderer-bakeoff/test-results/
          if-no-files-found: warn
      - name: Chrome performance and memory probes
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: npm run benchmark
      - name: Attach screenshots and machine-readable measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-bakeoff
          path: experiments/renderer-bakeoff/test-results/
          if-no-files-found: warn
