name: Stage PR67 integrated preview
on:
  push:
    branches:
      - automation/pr67-rebase-20261109
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/pr67-rebase-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build isolated combined-source preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard 354727ec28df471e63be7666c02beca1798e3740
          # Preserve independent changes from both branches. Git resolves
          # only overlapping conflict hunks in favour of the feature branch;
          # these source hunks are audited and tested separately.
          git merge --no-commit --no-ff -X ours origin/main
          for path in R/dashReactGrid.R dash_reactgrid/DashReactGrid.py dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map dash_reactgrid/metadata.json dash_reactgrid/package-info.json man/dashReactGrid.Rd src/jl/dashreactgrid.jl deps/dash_reactgrid.min.js deps/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js.map; do
            git restore --source=origin/main --staged --worktree -- "$path"
          done
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved source conflict"; git diff --name-only --diff-filter=U; exit 1
          fi
          # Keep the mainline workflow unchanged so Actions can push.
          git show origin/main:.github/workflows/js-tests.yml > .github/workflows/js-tests.yml
          git add -- .github/workflows/js-tests.yml
          git -c commit.gpgsign=false commit -m "TEMP: integrate main prior to squash rebase"
          git reset --soft origin/main
          git -c commit.gpgsign=false commit -m "feat: combine virtual whole-column editing and mainline features"
          python -m pip install --quiet "dash>=3,<5" "numpy>=1.23,<3" "pyyaml>=6,<7"
          npm ci --legacy-peer-deps
          npm run build
          git add -- R/dashReactGrid.R dash_reactgrid/DashReactGrid.py dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map dash_reactgrid/metadata.json dash_reactgrid/package-info.json man/dashReactGrid.Rd src/jl/dashreactgrid.jl deps/dash_reactgrid.min.js deps/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js.map
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit -m "build: regenerate assets after squash rebase onto main"
          fi
          git push --force-with-lease=refs/heads/automation/pr67-integrated-preview:5950b99f1354542074286a9f907826f8d6d7a588 origin HEAD:refs/heads/automation/pr67-integrated-preview
      - name: Run JavaScript tests
        if: success()
        run: npm run test:js
      - name: Run Python contract tests
        if: success()
        run: python -m unittest tests.test_component_contract tests.test_stateless_virtual_callbacks tests.test_virtual_grid_store -v
