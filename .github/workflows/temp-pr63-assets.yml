name: Temporary PR 63 asset build
on:
  push:
    branches:
      - fix/issue-cleanup-resizing-paste-20261107
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-cleanup-resizing-paste-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:js
      - run: npm run build:js
      - name: Commit rebuilt browser assets
        run: |
          cp dash_reactgrid/dash_reactgrid.min.js deps/dash_reactgrid.min.js
          cp dash_reactgrid/dash_reactgrid.min.js.map deps/dash_reactgrid.min.js.map
          cp dash_reactgrid/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js
          cp dash_reactgrid/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js.map
          git add dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map deps/dash_reactgrid.min.js deps/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js.map
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Dash browser assets for resizing and paste fixes"
          git push origin HEAD:fix/issue-cleanup-resizing-paste-20261107
