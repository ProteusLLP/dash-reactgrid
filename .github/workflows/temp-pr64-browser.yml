name: Temporary PR64 focused browser diagnostics
on:
  push:
    branches:
      - feat/excel-navigation-fill-multiedit-20261107
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3"
      - name: Test only keyboard navigation and multi-edit, with unbuffered output
        run: |
          python3 -u -m unittest -v \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_ctrl_arrow_navigates_across_paged_table \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_ctrl_arrows_select_and_fill_down_with_undo \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_shift_enter_applies_one_edit_to_selected_cells \
            tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_server_virtual_ctrl_arrow_and_range_selection
