name: Temporary PR64 virtual multi-edit diagnostic
on:
  push:
    branches:
      - feat/excel-navigation-fill-multiedit-20261107
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3"
      - name: Inspect virtual Shift+Enter in Chrome
        run: python3 -u -m unittest -v tests.test_feature_matrix_browser.FeatureMatrixChromeTests.test_server_virtual_shift_enter_submits_multi_cell_paste
