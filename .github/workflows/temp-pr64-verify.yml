name: Temporary PR64 full Chrome investigation
on:
  push:
    branches:
      - feat/excel-navigation-fill-multiedit-20261107
permissions:
  contents: write
concurrency:
  group: pr64-full-chrome-investigation
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/excel-navigation-fill-multiedit-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:js
      - run: npm run build:js
      - name: Commit deterministic browser bundles
        run: |
          cp dash_reactgrid/dash_reactgrid.min.js deps/dash_reactgrid.min.js
          cp dash_reactgrid/dash_reactgrid.min.js.map deps/dash_reactgrid.min.js.map
          cp dash_reactgrid/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js
          cp dash_reactgrid/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js.map
          git add dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map deps/dash_reactgrid.min.js deps/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js.map
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild browser bundles for keyboard selection delete"
          git push origin HEAD:feat/excel-navigation-fill-multiedit-20261107
      - run: python3 -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3"
      - name: Run unbuffered Chrome suite with hard diagnostic timeout
        run: timeout --signal=TERM --kill-after=10s 180s python3 -u tests/test_feature_matrix_browser.py
