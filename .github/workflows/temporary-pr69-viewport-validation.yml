name: Temporary PR69 Find Viewport Validation
on:
  push:
    branches: [feat/grid-find-virtual]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install "dash>=3,<5" "selenium>=4,<5" "numpy>=1.23,<3" "pandas>=2,<3" typing_extensions pyyaml
      - name: Rebuild generated JS and run JavaScript/Python tests
        run: |
          npm run build
          npm run test:js
          python -m unittest tests.test_component_contract tests.test_stateless_virtual_callbacks tests.test_dataframe tests.test_column tests.test_numpy_data -v
      - name: Run Chrome regressions
        run: |
          python tests/test_server_virtual_browser.py
          python tests/test_feature_matrix_browser.py
          python tests/test_sparse_browser.py
          python tests/test_virtual_operations_browser.py
          python tests/test_virtual_reliable_browser.py
      - name: Commit verified compiled assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/temporary-pr69-viewport-validation.yml
          git add -A
          git diff --cached --check
          git commit -m "build: regenerate browser assets for visible virtual Find results"
          git push origin HEAD:feat/grid-find-virtual
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
