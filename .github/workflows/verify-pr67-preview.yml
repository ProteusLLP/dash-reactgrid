name: Verify combined PR67 source and regenerate
on:
  push:
    branches:
      - automation/pr67-integrated-preview
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install "dash>=3,<5" "pyyaml>=6,<7" "numpy>=1.23,<3" "pandas>=2,<3" "selenium>=4,<5"
          npm ci --legacy-peer-deps
      - name: Rebuild all generated bindings and assets
        run: npm run build
      - name: JavaScript unit tests
        run: npm run test:js
      - name: Python backend and contract tests
        run: python -m unittest tests.test_component_contract tests.test_stateless_virtual_callbacks tests.test_virtual_grid_store tests.test_dataframe -v
      - name: Chrome editing and clipboard matrix
        run: python tests/test_feature_matrix_browser.py
      - name: Chrome server virtualization and search
        run: python tests/test_server_virtual_browser.py
      - name: Chrome large virtual clipboard and fill
        run: python tests/test_large_virtual_clipboard_browser.py
      - name: Chrome in-memory large cells
        run: python tests/test_large_in_memory_browser.py
      - name: Commit reproducibly generated assets after green tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- R/dashReactGrid.R dash_reactgrid/DashReactGrid.py dash_reactgrid/dash_reactgrid.min.js dash_reactgrid/dash_reactgrid.min.js.map dash_reactgrid/metadata.json dash_reactgrid/package-info.json man/dashReactGrid.Rd src/jl/dashreactgrid.jl deps/dash_reactgrid.min.js deps/dash_reactgrid.min.js.map inst/deps/dash_reactgrid.min.js inst/deps/dash_reactgrid.min.js.map
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit -m "build: regenerate bindings after integrating main"
            git push --force-with-lease=refs/heads/automation/pr67-integrated-preview:${{ github.sha }} origin HEAD:refs/heads/automation/pr67-integrated-preview
          fi
